services:
    database-postgres:
        image: postgres:latest
        container_name: database-postgres
        environment:
            - POSTGRES_DB=financeDB
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
        networks:
            - app-network
        ports:
            - 5432:5432

    logging-seq:
        image: datalust/seq:latest
        container_name: logging-seq
        environment:
          - ACCEPT_EULA=Y
          - SEQ_FIRSTRUN_NOAUTHENTICATION=true
        networks:
          - app-network
        ports:
          - 5341:5341
          - 8081:80

    finance-tracker-api:
        image: ${DOCKER_REGISTRY-}api
        container_name: finance-tracker-api
        build:
            context: .
            dockerfile: src/API/Dockerfile
        depends_on:
            - database-postgres
            - logging-seq
        networks:
            - app-network
        ports:
            - "5000:8080"
            - "5001:8082"
        environment:
            - DOTNET_ENVIRONMENT=Development
            - ConnectionStrings__Database=Host=database-postgres;Port=5432;Database=financeDB;Username=postgres;Password=postgres;
            - Seq__ServerUrl=http://logging-seq:5341
            - Serilog__WriteTo__1__Args__serverUrl=http://logging-seq:5341
            - Jwt__Secret=185C2E54-C194-4FC9-8B0D-B2C25FB577D3
networks:
  app-network:
    driver: bridge
